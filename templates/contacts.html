    * {
      margin: 0;
      padding: 0;
    }
  
    html {
      scroll-behaviour: smooth;

    :root {

    }
  
    .logo {
      width: 20%;
      display: flex;
      justify-content: center;
      align-items: center;
    }
  
    .logo img {
      width: 33%;
      border: 2px solid white;
      border-radius: 50px;
    }

      align-items: center;
      justify-content: center;
      position: sticky;
      top: 0;
      cursor: pointer;
    }

      width: 70%;
      display: flex;
    }
  
    .nav-list li {
      list-style: none;
      padding: 2px 6px;
    }
  
    .nav-list li a {
      text-decoration: none;
      color: white;
    }
  
    .nav-list li a:hover {
      color: grey;
    }
  
    .rightNav {
      width: 50;
      text-align: right;
    }
  
    #search {
      padding: 5px;
      font-size: 17px;
      border: 2px solid grey;
      border-radius: 9px;
    }
  
    .background {
      background-color: grey;
      background-blend-mode: darken;
      background-size: cover;
    }
  
    .firstsection {
      height: 100vh;
    }
  
    .box-main {
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      max-width: 50%;
      margin: auto;
      height: 80%;
    }
  
    .firstHalf {
      width: 75%;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
  
    .firstHalf img {

      border-radius: 9050px;
    }
  
    .text-big {
      font-family: 'Piazzolla', serif;
      font-weight: bold;
      font-size: 41px;
      text-align: center;
    }
  
    .text-small {
      font-family: 'Sansita Swashed', cursive;
      font-size: 18px;
      text-align: center;
    }
  
    #service {
      margin: 34px;
      display: flex;
    }
  
    #service .box {
      padding: 45px;
      margin: 3px 6px;
      border-radius: 28px;
    }
  
    #service .box img {
      margin-top: 20px;
      height: 100px;
      margin: auto;
      display: block;
      border-radius: 200px;
    }
  
    #service .box p {
      font-family: sans-serif;
      text-align: center;
    }
  
    .btn {
      padding: 8px 20px;
      margin: 7px 0;
      border: 2px solid white;
      border-radius: 8px;
      background: none;
      color: white;
      cursor: pointer;
    }
  
    .btn-sm {
      padding: 6px 10px;
      vertical-align: middle;
    }
  
    .center {
      text-align: center;
    }

      font-family: 'Ubuntu', sans-serif;

      justify-content: center;
